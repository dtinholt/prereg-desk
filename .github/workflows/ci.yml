name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Smoke test (page self-check in headless Chrome)
        run: CHROME="$(which chrome || which google-chrome)" sh tests/smoke.sh
      - name: Stress round (DevTools protocol)
        run: CHROME="$(which chrome || which google-chrome)" sh tests/run-stress.sh
