name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Chrome wrapper (the runner's kernel refuses Chrome's sandbox, so CI runs it with --no-sandbox)
        run: |
          BIN="$(which chrome || which google-chrome)"
          { echo '#!/bin/sh'; echo "exec \"$BIN\" --no-sandbox --disable-dev-shm-usage \"\$@\""; } > /usr/local/bin/chrome-ci
          chmod +x /usr/local/bin/chrome-ci
      - name: Smoke test (page self-check in headless Chrome)
        run: CHROME=/usr/local/bin/chrome-ci sh tests/smoke.sh
      - name: Stress round (DevTools protocol)
        run: CHROME=/usr/local/bin/chrome-ci sh tests/run-stress.sh
